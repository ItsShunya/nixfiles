name: Update flake.lock

on:
  # Every Monday at 04:00 UTC.
  schedule:
    - cron: "0 4 * * 1"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Open a pull request with the updated flake.lock
        uses: DeterminateSystems/update-flake-lock@v29
        with:
          commit-msg: "flake: update flake.lock"
          pr-title: "flake: update flake.lock"
          # PRs opened with the default GITHUB_TOKEN don't trigger the
          # build workflow. To get CI on these PRs, add a fine-grained PAT
          # (Contents + Pull requests: read/write) as FLAKE_UPDATE_TOKEN.
          # Without it, close and reopen the PR to run the build.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
